name: 信源可达性实测

# 一次性探针，回答「YouTube / Reddit / 国内源到底能不能取到数据」。
# 跑完看日志即可，不需要保留。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 逐源实测
        run: python3 scripts/probe_intl_sources.py
        continue-on-error: true
