name: Update Latest Release

# 每天定时获取 StevenMXZ/Adreno-Tools-Drivers 最新 Gen8 ZIP 信息，
# 写入 latest-release.json。前端优先读取此文件，避免直连 api.github.com。

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest Gen8 release info
        id: fetch
        run: |
          REPO="StevenMXZ/Adreno-Tools-Drivers"
          API="https://api.github.com/repos/${REPO}/releases/latest"

          echo "Fetching latest release from ${API}..."
          RESP=$(curl -sL -H "Accept: application/vnd.github+json" "${API}")

          # 从 latest release 中找 Gen8 zip
          ZIP_URL=$(echo "${RESP}" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0,'utf-8'));
            const asset = (data.assets || []).find(a => /Gen8/i.test(a.name) && a.name.toLowerCase().endsWith('.zip'));
            if (asset) { console.log(asset.browser_download_url); }
          ")

          VERSION=$(echo "${RESP}" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0,'utf-8'));
            console.log(data.tag_name || 'unknown');
          ")

          # 如果 latest 里没有 Gen8，往前翻 5 个 release
          if [ -z "${ZIP_URL}" ]; then
            echo "Gen8 not in latest, searching recent releases..."
            RESP2=$(curl -sL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/releases?per_page=5")
            RESULT=$(echo "${RESP2}" | node -e "
              const releases = JSON.parse(require('fs').readFileSync(0,'utf-8'));
              for (const r of releases) {
                const asset = (r.assets || []).find(a => /Gen8/i.test(a.name) && a.name.toLowerCase().endsWith('.zip'));
                if (asset) { console.log(r.tag_name + '|' + asset.browser_download_url); break; }
              }
            ")
            if [ -n "${RESULT}" ]; then
              VERSION="${RESULT%%|*}"
              ZIP_URL="${RESULT##*|}"
            fi
          fi

          if [ -z "${ZIP_URL}" ]; then
            echo "::error::No Gen8 zip found in any recent release"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_url=${ZIP_URL}" >> $GITHUB_OUTPUT
          echo "Found: ${VERSION} -> ${ZIP_URL}"

      - name: Write latest-release.json
        run: |
          cat > latest-release.json << EOF
          {
            "version": "${{ steps.fetch.outputs.version }}",
            "zipUrl": "${{ steps.fetch.outputs.zip_url }}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repo": "StevenMXZ/Adreno-Tools-Drivers",
            "note": "Auto-updated by GitHub Actions. Frontend reads this file to avoid direct api.github.com calls."
          }
          EOF
          cat latest-release.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet latest-release.json; then
            echo "No changes to latest-release.json"
          else
            git add latest-release.json
            git commit -m "chore: update latest Gen8 release to ${{ steps.fetch.outputs.version }}"
            git push origin main
          fi
