name: Feishu Notify (P0 only)
on:
  workflow_run:
    types: [completed]
  dependabot_alert:
    types: [created, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: \${{ secrets.FEISHU_WEBHOOK }}
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK", "")
          gh_token = os.environ.get("GH_TOKEN", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              e = json.load(f)

          def gh_api(url):
              if not url or not gh_token: return None
              try:
                  req = urllib.request.Request(url, headers={"Authorization": f"token {gh_token}", "Accept": "application/vnd.github+json"})
                  return json.loads(urllib.request.urlopen(req, timeout=10).read())
              except: return None

          title = ""
          lines = []

          if event_name == "workflow_run":
              wr = e.get("workflow_run", {})
              conclusion = wr.get("conclusion", "")
              if conclusion != "failure":
                  print("非失败构建，跳过通知")
                  exit(0)
              title = f"【P0】[构建失败] {repo}"
              lines.append(f"工作流：{wr.get('name','')}")
              lines.append(f"分支：{wr.get('head_branch','')}")
              lines.append(f"提交：{(wr.get('head_commit',{}).get('message') or '')[:60]}")
              # 获取失败的具体 job 和 step
              jobs_data = gh_api(wr.get("jobs_url", ""))
              if jobs_data:
                  failed = [j for j in jobs_data.get("jobs",[]) if j.get("conclusion")=="failure"]
                  if failed:
                      fj = failed[0]
                      steps = [s for s in fj.get("steps",[]) if s.get("conclusion")=="failure"]
                      lines.append(f"失败Job：{fj['name']}")
                      if steps: lines.append(f"失败步骤：{steps[0]['name']}")
              lines.append(f"链接：{wr.get('html_url','')}")

          elif event_name == "dependabot_alert":
              alert = e.get("alert", {})
              title = f"【P0】[安全警报] {repo}"
              lines.append(f"严重程度：{alert.get('security_vulnerability',{}).get('severity','')}")
              lines.append(f"包名：{alert.get('dependency',{}).get('package',{}).get('name','')}")
              lines.append(f"链接：{alert.get('html_url','')}")

          else:
              print(f"非 P0 事件：{event_name}，由 repo-monitor 聚合推送")
              exit(0)

          content = [[{"tag": "text", "text": l}] for l in lines]
          payload = {
              "msg_type": "post",
              "content": {"post": {"zh_cn": {"title": title, "content": content}}}
          }
          req = urllib.request.Request(webhook, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          resp = urllib.request.urlopen(req, timeout=10)
          print(f"飞书通知已发送：{title} ({resp.status})")
          PYEOF
