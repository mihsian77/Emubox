name: Feishu Notify
on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, closed, reopened]
  pull_request_review_comment:
    types: [created]
  fork:
  workflow_run:
    types: [completed]
  push:
    branches: [main, master]
  dependabot_alert:
    types: [created, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: \${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              e = json.load(f)

          title = ""
          lines = []

          if event_name == "issues":
              action = e.get("action", "")
              issue = e.get("issue", {})
              action_map = {"opened": "新建", "edited": "编辑", "closed": "关闭", "reopened": "重新打开"}
              title = f"[Issue] {repo} #{issue.get('number')} {action_map.get(action, action)}"
              lines.append(f"标题：{issue.get('title','')}")
              lines.append(f"作者：{issue.get('user',{}).get('login','')}")
              body = (issue.get('body') or '')[:200]
              if body: lines.append(f"内容：{body}")
              lines.append(f"链接：{issue.get('html_url','')}")

          elif event_name == "issue_comment":
              comment = e.get("comment", {})
              issue = e.get("issue", {})
              title = f"[Issue评论] {repo} #{issue.get('number')}"
              lines.append(f"评论者：{comment.get('user',{}).get('login','')}")
              lines.append(f"Issue：{issue.get('title','')}")
              body = (comment.get('body') or '')[:200]
              if body: lines.append(f"评论：{body}")
              lines.append(f"链接：{comment.get('html_url','')}")

          elif event_name == "pull_request":
              action = e.get("action", "")
              pr = e.get("pull_request", {})
              action_map = {"opened": "新建", "edited": "编辑", "closed": "关闭/合并", "reopened": "重新打开"}
              title = f"[PR] {repo} #{pr.get('number')} {action_map.get(action, action)}"
              lines.append(f"标题：{pr.get('title','')}")
              lines.append(f"作者：{pr.get('user',{}).get('login','')}")
              lines.append(f"分支：{pr.get('head',{}).get('ref','')} → {pr.get('base',{}).get('ref','')}")
              body = (pr.get('body') or '')[:150]
              if body: lines.append(f"描述：{body}")
              lines.append(f"链接：{pr.get('html_url','')}")

          elif event_name == "pull_request_review_comment":
              comment = e.get("comment", {})
              pr = e.get("pull_request", {})
              title = f"[PR评论] {repo} #{pr.get('number')}"
              lines.append(f"评论者：{comment.get('user',{}).get('login','')}")
              body = (comment.get('body') or '')[:200]
              if body: lines.append(f"评论：{body}")
              lines.append(f"链接：{comment.get('html_url','')}")

          elif event_name == "fork":
              forkee = e.get("forkee", {})
              title = f"[Fork] {repo} 被 Fork"
              lines.append(f"Fork者：{forkee.get('owner',{}).get('login','')}")
              lines.append(f"新仓库：{forkee.get('full_name','')}")
              lines.append(f"链接：{forkee.get('html_url','')}")

          elif event_name == "workflow_run":
              wr = e.get("workflow_run", {})
              conclusion = wr.get("conclusion", "")
              if conclusion != "failure":
                  print("非失败构建，跳过通知")
                  exit(0)
              title = f"[构建失败] {repo}"
              lines.append(f"工作流：{wr.get('name','')}")
              lines.append(f"分支：{wr.get('head_branch','')}")
              lines.append(f"提交：{(wr.get('head_commit',{}).get('message') or '')[:80]}")
              lines.append(f"链接：{wr.get('html_url','')}")

          elif event_name == "push":
              ref = e.get("ref", "").replace("refs/heads/", "")
              pusher = e.get("pusher", {}).get("name", "")
              commits = e.get("commits", [])
              title = f"[Push] {repo} ({ref})"
              lines.append(f"推送者：{pusher}")
              lines.append(f"提交数：{len(commits)}")
              for c in commits[:3]:
                  lines.append(f"  - {c.get('message','').split(chr(10))[0][:60]} ({c.get('author',{}).get('name','')})")
              lines.append(f"链接：{e.get('compare','')}")

          elif event_name == "dependabot_alert":
              alert = e.get("alert", {})
              title = f"[安全警报] {repo}"
              lines.append(f"严重程度：{alert.get('security_vulnerability',{}).get('severity','')}")
              lines.append(f"包名：{alert.get('dependency',{}).get('package',{}).get('name','')}")
              lines.append(f"描述：{(alert.get('security_advisory',{}).get('description') or '')[:150]}")
              lines.append(f"链接：{alert.get('html_url','')}")

          else:
              print(f"未处理的事件类型：{event_name}")
              exit(0)

          content = [[{"tag": "text", "text": l}] for l in lines]
          payload = {
              "msg_type": "post",
              "content": {"post": {"zh_cn": {"title": title, "content": content}}}
          }
          req = urllib.request.Request(webhook, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          resp = urllib.request.urlopen(req, timeout=10)
          print(f"飞书通知已发送：{title} ({resp.status})")
          PYEOF
