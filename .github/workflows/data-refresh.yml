name: 每日数据刷新（合并提交）

# 做什么：把原来 4 个独立 workflow（榜单快照 / 驱动模拟器排行 / EmuReady 目录 / 跑分）
# 串到一个 job 里跑，最后只产生 1 次 commit。
#
# 为什么合并：原来每类数据各推一次，一天 7 条 chore 提交，且每条都会触发全量 CI（含 APK 编译）。
# 合并后一天 1 条数据提交；配合 ci.yml 的 paths-ignore，数据更新不再触发编译。
#
# 为什么每步 continue-on-error：单点失败（比如 Playwright 装不上、某个站点临时 502）
# 不能连累其他数据，最后统一提交已成功的那部分。
#
# ⚠ 2026-11 修复：原先第 2 步把 6 个脚本串在同一个 `run: |` 里，GitHub Actions 用
# `bash -e` 执行，第一个脚本崩溃后同 block 内后续脚本全部不执行；加上整步
# continue-on-error: true，工作流一直显示绿色，数据静默冻结了 11 天都没人发现。
# 现在改为：一个脚本一个 step（崩溃不相互连累），并在最后用「检查刷新结果」把任一
# 步骤的失败升级为 job 失败（红色 + 报错信息），数据陈旧不再无声无息。

on:
  schedule:
    # UTC 18:40 ≈ 北京时间 02:40，避开新闻任务与白天高峰
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # 刷新连续失败时开 issue：job 标红只出现在 Actions 页面，没人会去看
  issues: write

# 所有直推 main 的数据工作流共用同一互斥组：并发推送互相覆盖会
# non-fast-forward 失败，排队执行即可（数据任务错峰，实际几乎不排队）
concurrency:
  group: data-push-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 1) 榜单快照必须最先跑：下载量历史增量补不回来 ──────────────
      - name: 榜单快照
        id: ranking
        continue-on-error: true
        run: python3 scripts/ranking.py

      # ── 2) 驱动 / 模拟器 / 排行 / 配置推荐（拆成独立 step）──────────
      - name: 刷新驱动源
        id: registry
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-registry.py

      - name: 刷新模拟器排行榜
        id: ranking_refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-ranking.py

      - name: 刷新模拟器元数据
        id: emulator_registry
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh-emulator-registry.py

      - name: 聚合配置推荐
        id: recipes
        continue-on-error: true
        run: python3 scripts/aggregate-recipes.py --clone

      # registry 变了必须重建索引，否则 App 首屏还是旧数据
      - name: 重建索引与离线兜底
        id: build_index
        continue-on-error: true
        run: python3 scripts/build_index.py

      # driver-registry 变了也要重刷源说明，否则 profile-check 对账必挂
      - name: 重建源说明
        id: source_profiles
        continue-on-error: true
        run: python3 scripts/build_source_profiles.py

      # ── 3) EmuReady 目录（仅标准库）─────────────────────────────
      - name: 刷新 EmuReady 目录
        id: emuready
        continue-on-error: true
        run: python3 scripts/refresh-emuready.py

      # ── 4) 跑分数据 ────────────────────────────────────────────
      - name: 安装 Playwright 与 Chromium
        id: playwright
        continue-on-error: true
        run: |
          npm init -y
          npm i playwright@1.62.0
          sudo npx playwright install-deps chromium
          npx playwright install chromium

      - name: 抓取跑分
        id: bench_fetch
        continue-on-error: true
        run: |
          node scripts/bench/fetch_antutu.js
          node scripts/bench/fetch_ludashi.js

      - name: 解析跑分
        id: bench_parse
        continue-on-error: true
        run: |
          python3 scripts/bench/parse_bench.py
          python3 scripts/bench/check_bench.py
          python3 scripts/bench/build_meta.py

      - name: 抓取芯片规格
        id: soc_fetch
        continue-on-error: true
        run: |
          node scripts/bench/fetch_soc_specs.js
          python3 scripts/bench/build_specs.py
          python3 scripts/soc/build_master.py --fetch

      # 可玩库矩阵的输入是 soc_master，必须紧跟其后重建；
      # 否则芯片库每天更新、可玩库分数停在生成那天
      - name: 重建可玩库矩阵
        id: playable
        continue-on-error: true
        run: python3 scripts/build_playable.py

      - name: 同步内置数据到 assets
        id: sync_assets
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/bench
          for f in antutu_soc ludashi manifest soc_specs; do
            if [ -f "bench-data/$f.json" ]; then
              cp "bench-data/$f.json" "app/src/main/assets/bench/$f.json"
            else
              echo "::warning::bench-data/$f.json 不存在，跳过"
            fi
          done

      # ── 5) 汇总检查：任一步骤失败则 job 标红（修复「静默失败」）────
      - name: 检查刷新结果
        if: always()
        run: |
          failed=""
          check() { if [ "$2" = "failure" ]; then failed="$failed $1"; fi; }
          check 榜单快照          "${{ steps.ranking.outcome }}"
          check 刷新驱动源        "${{ steps.registry.outcome }}"
          check 刷新排行榜        "${{ steps.ranking_refresh.outcome }}"
          check 刷新模拟器元数据  "${{ steps.emulator_registry.outcome }}"
          check 聚合配置推荐      "${{ steps.recipes.outcome }}"
          check 重建索引          "${{ steps.build_index.outcome }}"
          check 重建源说明        "${{ steps.source_profiles.outcome }}"
          check 刷新EmuReady      "${{ steps.emuready.outcome }}"
          check 安装Playwright    "${{ steps.playwright.outcome }}"
          check 抓取跑分          "${{ steps.bench_fetch.outcome }}"
          check 解析跑分          "${{ steps.bench_parse.outcome }}"
          check 抓取芯片规格      "${{ steps.soc_fetch.outcome }}"
          check 重建可玩库        "${{ steps.playable.outcome }}"
          check 同步assets        "${{ steps.sync_assets.outcome }}"
          # 跑分抓取失败不会让 step 变红：parse_bench 会标 stale、沿用上一版、
          # 退出码 0。这种「绿着但数据没更新」比直接报错更难发现，单独判一次。
          # 第一次 stale 只 warning（站点偶发超时很常见），连续两天才升级为失败：
          # 连续多天同一个源抓不到，说明它已经废了，必须有人来看。
          stale_report=$(python3 -c "import json;m=json.load(open('bench-data/manifest.json',encoding='utf-8'));print(' '.join(k+':'+str(v.get('stale_days',1)) for k,v in (m.get('sources') or {}).items() if v.get('status')=='stale'))" 2>/dev/null || true)
          if [ -n "$stale_report" ]; then
            echo "::warning::跑分源本轮未更新（源:连续天数）：$stale_report"
            echo "跑分源未更新：$stale_report" >> "$GITHUB_STEP_SUMMARY"
            for pair in $stale_report; do
              days=${pair##*:}
              case "$days" in ''|*[!0-9]*) days=1 ;; esac
              if [ "$days" -ge 2 ]; then
                failed="$failed 跑分源${pair%%:*}已连续${days}天未更新"
              fi
            done
          fi
          if [ -n "$failed" ]; then
            echo "::error::以下刷新步骤失败，数据可能陈旧：$failed"
            echo "刷新失败步骤：$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "全部刷新步骤成功" >> "$GITHUB_STEP_SUMMARY"

      - name: 有变化则合并提交一次
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATHS="data/driver-registry.json \
                 app/src/main/assets/driver-registry.json \
                 catalog/catalog.json \
                 data/emulator-ranking.json \
                 data/emulator-registry.json \
                 app/src/main/assets/winlator-recipes.json \
                 app/src/main/assets/emuready-catalog.json \
                 data/emulator-index.json \
                 data/emulator-details-*.json \
                 app/src/main/assets/emulator-offline.json \
                 app/src/main/assets/source-profiles.json \
                 app/src/main/assets/playable-matrix.json \
                 data/ranking-history data/ranking.json \
                 app/src/main/assets/bench app/src/main/assets/soc_master.json bench-data"
          if git diff --quiet -- $PATHS; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git config user.name "emubox-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "chore(data): 每日刷新 $(date -u +%F)"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # main 可能被人工合并或别的数据任务推进；裸 push 会 non-fast-forward，
          # 这次抓到的数据就丢了。先 rebase 再推，最多重试三次。
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && break
            sleep 5
          done

      # ── 6) 失败通知：开 issue，恢复后自动关闭 ──────────────────────
      # 只把 job 标红不够：这个 workflow 在凌晨跑，没人会去 Actions 页面看。
      # 跑分链上次静默坏了四天，就是这么漏的——issue 至少会推到手机上。
      - name: 失败时开 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -u
          gh label create data-refresh --color B60205 \
            --description "每日数据刷新失败" --force >/dev/null 2>&1 || true

          # 数据停在哪天：读产物内的时间戳，不看 git 提交时间。
          # antutu_soc.json 在 11-21 被提交过，内容里的 fetched_at 还是 11-18，
          # 光看提交记录会以为数据是新的。
          stale=$(python3 -c "
          import json
          try:
              m = json.load(open('bench-data/manifest.json', encoding='utf-8'))
          except Exception:
              print('未知'); raise SystemExit
          out = []
          for k, v in (m.get('sources') or {}).items():
              if v.get('status') == 'stale':
                  out.append(k + ' 停在 ' + str(v.get('fetched_at') or '未知') + '（连续 ' + str(v.get('stale_days', 1)) + ' 天）')
          print('；'.join(out) if out else 'manifest 未标记 stale')
          " 2>/dev/null || echo "未知")

          body=$(cat <<EOF
          ## 每日数据刷新失败

          - 运行：[#${{ github.run_id }}]($RUN_URL)
          - 触发方式：\`$TRIGGER\`
          - 失败明细：见运行页面最后一步「检查刷新结果」的报错
          - 数据状态：$stale

          修好失败步骤后，下一次定时运行成功会自动关闭本 issue。
          EOF
          )

          existing=$(gh issue list --label data-refresh --state open --limit 1 \
                     --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "已在 issue #$existing 追加本次失败" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            gh issue create --title "每日数据刷新失败 $(date -u +%F)" \
              --label data-refresh --body "$body" \
              || gh issue create --title "每日数据刷新失败 $(date -u +%F)" --body "$body"
          fi

      - name: 成功时关闭失败 issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          existing=$(gh issue list --label data-refresh --state open --limit 1 \
                     --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "本次刷新全部步骤成功，数据已更新，自动关闭。"
            echo "已关闭 issue #$existing" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
