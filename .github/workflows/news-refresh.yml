name: 每日刷新新闻数据

on:
  schedule:
    # UTC 02:30 / 14:30 ≈ 北京时间 10:30 / 22:30
    - cron: "30 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取资讯 RSS 并分类落位
        run: |
          python3 scripts/refresh-news.py

      - name: 有变化则提交
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- news-data.json app/src/main/assets/news_offline.json; then
            git config user.name "emubox-ci[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news-data.json app/src/main/assets/news_offline.json
            git commit -m "chore: 刷新新闻数据"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          else
            echo "无变化，跳过提交"
          fi
