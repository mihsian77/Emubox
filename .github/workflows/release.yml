name: Release 发布

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # build.gradle.kts 从 ~/.emubox/keystore/keystore.properties 读取签名配置
            mkdir -p ~/.emubox/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            cat > ~/.emubox/keystore/keystore.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "使用正式签名"
          else
            echo "未配置签名 secret，回退 debug 签名"
          fi

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 重命名 APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "EmuBox-${TAG}.apk"
          ls -la "EmuBox-${TAG}.apk"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: EmuBox-*.apk
          # 不用自动生成的 "What's Changed + 提交者" 列表：这个项目是独立开发，
          # 更新日志按「功能/修复」写成人话，维护在 .github/release-notes.md
          body_path: .github/release-notes.md
          # tag 带 pre 的一律标记为预发布，不占用「最新正式版」的位置
          prerelease: ${{ contains(github.ref_name, 'pre') }}
          make_latest: ${{ contains(github.ref_name, 'pre') && 'false' || 'true' }}
