name: 每日刷新 EmuReady 目录

on:
  # 已并入 data-refresh.yml（每日一次合并提交）；此处保留手动触发用于单独调试
  # schedule:
  #   # UTC 18:40 ≈ 北京时间 02:40，避开新闻/社区任务
  #   - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 与数据工作流共用互斥组，防并发推送 main 冲突
concurrency:
  group: data-push-main
  cancel-in-progress: false

jobs:
  refresh-emuready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只用标准库，无需装依赖
      - name: 抓取设备/平台/模拟器目录
        run: python3 scripts/refresh-emuready.py

      - name: 有变化则提交
        run: |
          if ! git diff --quiet -- app/src/main/assets/emuready-catalog.json; then
            git config user.name "emubox-ci[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/emuready-catalog.json
            git commit -m "chore: 刷新 EmuReady 设备目录"
            # main 可能被人工合并或别的数据任务推进；裸 push 会 non-fast-forward，
            # 这次抓到的数据就丢了。先 rebase 再推，最多重试三次。
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
              git push origin HEAD:main && break
              sleep 5
            done
          else
            echo "无变化，跳过提交"
          fi
