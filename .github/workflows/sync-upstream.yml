name: Sync Upstream

# 每天自动从上游 NotZeetaa/EmuHub 合并更新。
# 合并成功直接 push；有冲突则开 PR 人工处理。

on:
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00（北京时间凌晨 2:00）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NotZeetaa/EmuHub.git || true
          git fetch upstream main --depth=50

      - name: Merge upstream/main
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already merged. Nothing to do."
            echo "status=up-to-date" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git merge upstream/main --no-edit -X theirs; then
            echo "Merge succeeded."
            echo "status=merged" >> $GITHUB_OUTPUT
          else
            echo "Merge failed with conflicts."
            echo "status=conflict" >> $GITHUB_OUTPUT
            git merge --abort || true
          fi

      - name: Push merged changes
        if: steps.merge.outputs.status == 'merged'
        run: git push origin main

      - name: Create conflict PR
        if: steps.merge.outputs.status == 'conflict'
        run: |
          BRANCH="sync-upstream-conflict-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit -X theirs || true
          # 即使有冲突也提交，让 PR 里能看到冲突标记
          git add -A
          git commit -m "chore: merge upstream (conflicts need manual resolution)" || true
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Open PR for conflicts
        if: steps.merge.outputs.status == 'conflict'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ env.BRANCH }}
          destination_branch: main
          pr_title: "⚠️ 上游更新合并冲突，需人工处理"
          pr_body: |
            自动合并上游 NotZeetaa/EmuHub 时发生冲突。

            请检查以下文件的冲突标记并解决：
            - 运行 `git diff --name-only --diff-filter=U` 查看冲突文件

            解决后合并此 PR 即可。
          pr_label: "upstream-sync,conflict"
