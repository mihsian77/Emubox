name: 每日榜单快照

# 做什么：每天把当前各项目的 downloads / stars 存一份到 ranking-history/，
# 并重算 ranking.json。
#
# 为什么这条最重要：累计下载量随时能补抓，**历史增量补不了**。
# 「涨得最快」这个榜靠的就是这些日快照做差；今天不存，两周后还是空白。
#
# 为什么放 CI 而不是本地：本地没人每天开机器。快照必须无人值守地攒。

on:
  # 已并入 data-refresh.yml（每日一次合并提交）；此处保留手动触发用于单独调试
  # schedule:
  #   - cron: "10 20 * * *"     # 每天 04:10 (UTC+8)，在下载量刷新之前
  workflow_dispatch:

permissions:
  contents: write

# 与数据工作流共用互斥组，防并发推送 main 冲突
concurrency:
  group: data-push-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 落快照并重算榜单
        run: python3 scripts/ranking.py

      - name: 有变化则提交
        run: |
          if ! git diff --quiet -- ranking-history ranking.json; then
            git config user.name "emubox-ci[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ranking-history ranking.json
            git commit -m "chore(ranking): 每日快照 $(date -u +%F)"
            # main 可能被人工合并或别的数据任务推进；裸 push 会 non-fast-forward，
            # 这次抓到的数据就丢了。先 rebase 再推，最多重试三次。
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
              git push origin HEAD:main && break
              sleep 5
            done
          else
            echo "无变化，跳过提交"
          fi
