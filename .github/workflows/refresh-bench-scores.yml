name: 刷新跑分数据（安兔兔/鲁大师）

on:
  schedule:
    # UTC 03:00 ≈ 北京时间 11:00，排在驱动源刷新之后
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Playwright 与 Chromium
        run: |
          npm init -y
          npm i playwright@1.62.0
          sudo npx playwright install-deps chromium
          npx playwright install chromium

      - name: 抓取安兔兔 SoC 天梯 + 鲁大师五榜
        run: |
          node scripts/bench/fetch_antutu.js
          node scripts/bench/fetch_ludashi.js

      - name: 解析并校验数据完整性
        run: |
          python3 scripts/bench/parse_bench.py
          python3 scripts/bench/check_bench.py
          python3 scripts/bench/build_meta.py
          node scripts/bench/fetch_soc_specs.js
          python3 scripts/bench/build_specs.py

      - name: 同步内置数据到 assets 并提交
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/bench
          cp bench-data/antutu_soc.json app/src/main/assets/bench/antutu_soc.json
          cp bench-data/ludashi.json app/src/main/assets/bench/ludashi.json
          cp bench-data/manifest.json app/src/main/assets/bench/manifest.json
          cp bench-data/soc_specs.json app/src/main/assets/bench/soc_specs.json
          # bench-data 与 assets 双副本一起提交，避免仓库内两份数据漂移
          if ! git diff --quiet -- app/src/main/assets/bench bench-data; then
            git config user.name "emubox-ci[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/bench bench-data
            git commit -m "chore: 刷新跑分数据"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          else
            echo "跑分数据无变化，跳过提交"
          fi
