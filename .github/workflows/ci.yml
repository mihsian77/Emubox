name: CI 构建与校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  registry-check:
    name: 驱动注册表 schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 registry schema 完整性
        run: python3 scripts/validate-registry.py

  emulator-check:
    name: 模拟器注册表校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验模拟器 registry（来源/dead/下载直链）
        run: python3 scripts/validate-emulators.py

  i18n-check:
    name: i18n 翻译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 i18n 校验
        run: python3 scripts/check-i18n.py

  lint:
    name: Android Lint 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 运行 Lint
        run: ./gradlew lint --no-daemon
      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    name: 编译检查
    runs-on: ubuntu-latest
    needs: [i18n-check, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # build.gradle.kts 从 ~/.emubox/keystore/keystore.properties 读取签名配置
            mkdir -p ~/.emubox/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            cat > ~/.emubox/keystore/keystore.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "使用正式签名"
          else
            echo "未配置签名 secret，回退 debug 签名"
          fi
      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: emubox-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - name: 发布预发布（固定预发布版本号，Releases 置顶）
        run: |
          # 预发布版本号固定取 versionName（当前 1.3.0-pre，不超过正式版 v1.3.0），
          # tag 不带 v 前缀，与正式版 tag（v1.x.y）区分开，release.yml 的 v* 不会重复触发。
          # delete+create 让发布时间保持最新 → Releases 列表置顶显示。
          # 旧版 1.3.6 预发布标签一次性清理（幂等）。
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "预发布版本号: $VER"
          gh release delete "1.3.6" --yes --cleanup-tag 2>/dev/null || true
          gh release delete "$VER" --yes --cleanup-tag 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk "EmuBox-${VER}.apk"
          gh release create "$VER" --prerelease --title "$VER（预发布）" \
            --notes "CI 自动构建的预发布版（当前开发中的最新构建）。正式版见 v* tag 发布的 Release。" \
            "EmuBox-${VER}.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
