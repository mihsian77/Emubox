name: CI 构建与校验

# 只处理代码改动。纯数据改动走 ci-data.yml（只做 schema 校验，不编译）。
# 这样每天的数据自动刷新不会再触发 APK 构建。

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.json'
      - 'ranking-history/**'
      - 'bench-data/**'
      - 'catalog/**'
      - 'app/src/main/assets/**/*.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.json'
      - 'ranking-history/**'
      - 'bench-data/**'
      - 'catalog/**'
      - 'app/src/main/assets/**/*.json'

jobs:
  i18n-check:
    name: i18n 翻译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 i18n 校验
        run: python3 scripts/check-i18n.py

  lint:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取自研渲染内核（闭源 AAR）
        env:
          DRIVERCHECK_TOKEN: ${{ secrets.DRIVERCHECK_TOKEN }}
        run: |
          if [ -z "$DRIVERCHECK_TOKEN" ]; then
            echo "::error::缺少 secrets.DRIVERCHECK_TOKEN：请配置一个只读 mihsian77/emubox-drivercheck 的令牌"
            exit 1
          fi
          mkdir -p app/libs
          # 私有仓 asset 必须走 API：github.com/releases/download 对私有仓不作为鉴权入口
          AID=$(curl -fsSL -H "Authorization: Bearer $DRIVERCHECK_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/mihsian77/emubox-drivercheck/releases/tags/aar-latest \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['assets'][0]['id'])")
          curl -fsSL --retry 3 -H "Authorization: Bearer $DRIVERCHECK_TOKEN" \
            -H "Accept: application/octet-stream" -o app/libs/drivercheck.aar \
            "https://api.github.com/repos/mihsian77/emubox-drivercheck/releases/assets/$AID"
          ls -l app/libs/drivercheck.aar
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 运行 Lint
        run: ./gradlew lint --no-daemon
      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
      # 仓库有 18 个单元测试文件（Robolectric/Roborazzi），此前 CI 只编译从不执行，
      # 逻辑回归完全没被拦。单测在 lint 之后串行跑，失败即阻断合并。
      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest

  build:
    name: 编译检查
    runs-on: ubuntu-latest
    needs: [i18n-check, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 拉取自研渲染内核（闭源 AAR）
        env:
          DRIVERCHECK_TOKEN: ${{ secrets.DRIVERCHECK_TOKEN }}
        run: |
          if [ -z "$DRIVERCHECK_TOKEN" ]; then
            echo "::error::缺少 secrets.DRIVERCHECK_TOKEN：请配置一个只读 mihsian77/emubox-drivercheck 的令牌"
            exit 1
          fi
          mkdir -p app/libs
          # 私有仓 asset 必须走 API：github.com/releases/download 对私有仓不作为鉴权入口
          AID=$(curl -fsSL -H "Authorization: Bearer $DRIVERCHECK_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/mihsian77/emubox-drivercheck/releases/tags/aar-latest \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['assets'][0]['id'])")
          curl -fsSL --retry 3 -H "Authorization: Bearer $DRIVERCHECK_TOKEN" \
            -H "Accept: application/octet-stream" -o app/libs/drivercheck.aar \
            "https://api.github.com/repos/mihsian77/emubox-drivercheck/releases/assets/$AID"
          ls -l app/libs/drivercheck.aar
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # build.gradle.kts 从 ~/.emubox/keystore/keystore.properties 读取签名配置
            mkdir -p ~/.emubox/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            cat > ~/.emubox/keystore/keystore.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "使用正式签名"
          else
            echo "未配置签名 secret，回退 debug 签名"
          fi
      - name: 计算预发布版本号
        id: ver
        run: |
          # 预发布 tag 由 gradle 里的基线版本派生（1.4.0-pre → v1.4.0-pre），
          # 整个 1.4.0 周期只对应这一条 release；切到 1.5.0 时只改 gradle 默认值，这里自动跟着换。
          # 构建序号只进 versionName，不进 tag —— 列表里不会堆出一串 pre.1 / pre.2 / pre.77。
          BASE=$(grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+(?=-pre")' app/build.gradle.kts | head -1)
          BASE=${BASE:-1.4.0}
          IFS=. read -r MAJ MIN PATCH <<< "$BASE"
          # 末段 build 留 0–899 给预发布，999 留给正式版，保证同版本号下正式版包能覆盖预发布包装的那个
          BUILD=$(( GITHUB_RUN_NUMBER % 900 + 1 ))
          CODE=$(( MAJ * 10000000 + MIN * 100000 + PATCH * 1000 + BUILD ))
          # pre 号必须取 BUILD 而不是 GITHUB_RUN_NUMBER：CODE 用的是 BUILD，
          # 两处不一致会让 versionName 与 versionCode 末段差 1（pre.442 配 10400443）
          NAME="${BASE}-pre.${BUILD}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}-pre" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "本次预发布: $NAME ($CODE) → v${BASE}-pre"
      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon -PemuboxVersionCode=${{ steps.ver.outputs.code }} -PemuboxVersionName=${{ steps.ver.outputs.name }}
      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon -PemuboxVersionCode=${{ steps.ver.outputs.code }} -PemuboxVersionName=${{ steps.ver.outputs.name }}
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: emubox-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - name: 清理历史预发布条目
        # 只在 main 的 push 上发布：PR 的构建产物不能覆盖线上预发布包
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 旧机制每次构建新建一条带编号的 release，列表里堆出了 pre.2 / pre.77 / 1.3.0-pre 三条，
          # 其中 v1.3.0-pre.77 还被 GitHub 自动生成了带 @提交者的 What's Changed。
          # 新机制一个功能批次只有一条 v<base>-pre，这里把不符合新命名的旧条目收掉（幂等）。
          KEEP="${{ steps.ver.outputs.tag }}"
          for TAG in $(gh release list --limit 100 --json tagName -q '.[].tagName' \
                       | grep -E '\-pre\.[0-9]+$' || true); do
            [ "$TAG" = "$KEEP" ] && continue
            echo "删除旧预发布条目 $TAG"
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          done
          if [ "$KEEP" != "v1.3.0-pre" ]; then
            gh release delete "v1.3.0-pre" --yes --cleanup-tag 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布预发布（固定 tag，移动 tag 并换包）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 整个 1.4.0 周期只对应一条 release：tag 恒为 v1.4.0-pre，内容每次构建覆盖。
          # tag 跟着最新提交走，release 页面显示的提交和源码包才是这次编译的那份；
          # 不新建带编号的 tag，发布列表里就不会堆出一串 pre.1 / pre.2 / pre.77。
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.name }}"
          APK="EmuBox-${{ steps.ver.outputs.base }}-pre.apk"
          TITLE="EmuBox ${{ steps.ver.outputs.base }}（预发布）"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在：只更新状态、标题与正文，再清空旧资产传新包（同名不堆积）
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes-file .github/release-notes.md
            for old in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
            done
            gh release upload "$TAG" "$APK"
          else
            gh release create "$TAG" --prerelease --title "$TITLE" \
              --notes-file .github/release-notes.md "$APK"
          fi
          echo "已更新 $TAG → $VER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
