name: CI 构建与校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n-check:
    name: i18n 翻译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 i18n 校验
        run: python3 scripts/check-i18n.py

  lint:
    name: Android Lint 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 运行 Lint
        run: ./gradlew lint --no-daemon
      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    name: 编译检查
    runs-on: ubuntu-latest
    needs: [i18n-check, lint]
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: emubox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
