name: CI 构建与校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  registry-check:
    name: 驱动注册表 schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 registry schema 完整性
        run: python3 scripts/validate-registry.py

  emulator-check:
    name: 模拟器注册表校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验模拟器 registry（来源/dead/下载直链）
        run: python3 scripts/validate-emulators.py

  i18n-check:
    name: i18n 翻译校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 i18n 校验
        run: python3 scripts/check-i18n.py

  lint:
    name: Android Lint 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 运行 Lint
        run: ./gradlew lint --no-daemon
      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build:
    name: 编译检查
    runs-on: ubuntu-latest
    needs: [i18n-check, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # build.gradle.kts 从 ~/.emubox/keystore/keystore.properties 读取签名配置
            mkdir -p ~/.emubox/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            cat > ~/.emubox/keystore/keystore.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "使用正式签名"
          else
            echo "未配置签名 secret，回退 debug 签名"
          fi
      - name: 生成递增预发布版本号
        run: |
          # 每次构建预发布小版本号 +1（读固定 tag 现有 APK 名推断上次值），写入 gradle 参与编译，
          # 这样 App 内版本号和 APK 文件名都是 1.3.0-pre.N，能区分每次构建。
          # 标签固定用 v1.3.0-pre（长期不换），发布阶段只更新 asset，不重建 release。
          TAG="v1.3.0-pre"
          LAST_N=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -oP '1\.3\.0-pre\.\K[0-9]+' | head -1)
          N=$(( ${LAST_N:-0} + 1 ))
          sed -i "s/versionName = \"1.3.0-pre\"/versionName = \"1.3.0-pre.$N\"/" app/build.gradle.kts
          echo "本次预发布版本号: 1.3.0-pre.$N"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: 编译 Release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: emubox-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - name: 发布预发布（固定标签，asset 递增覆盖）
        run: |
          # 标签固定 v1.3.0-pre（长期用），每次构建版本号递增（1.3.0-pre.N）由前一步写入 gradle。
          # release 已存在则只换 asset（清旧传新），不存在才创建 → 标签不变、发布时间不漂移。
          # 旧版 1.3.6 预发布标签一次性清理（幂等）。
          TAG="v1.3.0-pre"
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "预发布版本号: $VER"
          gh release delete "1.3.6" --yes --cleanup-tag 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk "EmuBox-${VER}.apk"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            for old in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); do
              gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
            done
            gh release upload "$TAG" "EmuBox-${VER}.apk" --clobber
          else
            gh release create "$TAG" --prerelease --title "$TAG（预发布）" \
              --notes "CI 自动构建的预发布版（每次构建版本号递增）。正式版见 v* tag 发布的 Release。" \
              "EmuBox-${VER}.apk"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
