name: 数据校验

# 只校验数据文件，不编译 APK。
# 拆分原因：数据每天自动刷新，原来每次都会触发 Android 编译（lint + assembleDebug + assembleRelease），
# 一天白烧 6~8 次构建。数据改动只需 schema 校验，代码改动才需要编译。

on:
  push:
    branches: [main]
    paths:
      - '*.json'
      - 'ranking-history/**'
      - 'bench-data/**'
      - 'catalog/**'
      - 'app/src/main/assets/**/*.json'
  pull_request:
    branches: [main]
    paths:
      - '*.json'
      - 'ranking-history/**'
      - 'bench-data/**'
      - 'catalog/**'
      - 'app/src/main/assets/**/*.json'

jobs:
  registry-check:
    name: 驱动注册表 schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 registry schema 完整性
        run: python3 scripts/validate-registry.py

  emulator-check:
    name: 模拟器注册表校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验模拟器 registry（来源/dead/下载直链）
        run: python3 scripts/validate-emulators.py

  schema-check:
    name: 字段命名与类型
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 历史上字段名分裂成两套（logo_url/logoUrl、downloads/downloads_latest），
      # App 只能靠 ifBlank 兜底。这个 job 保证不再长出新方言。
      - name: 校验注册表 schema
        run: python3 scripts/validate-schema.py

  index-check:
    name: 索引与详情是否最新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 重新生成索引，检查是否与 registry 同步
        run: |
          python3 scripts/build_index.py
          git diff --exit-code emulator-index.json emulator-details-*.json \
            app/src/main/assets/emulator-offline.json \
            || (echo "::error::registry 改了但索引没重新生成，本地跑 python3 scripts/build_index.py" && exit 1)

  profile-check:
    name: 驱动/组件说明是否最新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 驱动页每条源的「给谁用 / 怎么装」由 catalog/source-profiles.json 手写文案
      # + driver-registry.json 的字段合成。注册表新增源却忘了补文案时，
      # 卡片上就只剩一行作者简介，用户看不出该不该装。
      - name: 重新生成源说明，检查是否与注册表同步
        run: |
          python3 scripts/build_source_profiles.py
          git diff --exit-code app/src/main/assets/source-profiles.json \
            || (echo "::error::source-profiles.json 与注册表不同步，本地跑 python3 scripts/build_source_profiles.py" && exit 1)
